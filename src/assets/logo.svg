<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Azmain BD Int — House Of Global Brand">
  <title>Azmain BD Int</title>

  <!--
    Placeholder rendition of the client's mark, built to their colours and
    proportions so the site never ships a broken image. Replace this file with
    the supplied transparent PNG (keep the filename, or point Logo.jsx at it)
    for the production build.
  -->

  <defs>
    <linearGradient id="azGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15a03a"/>
      <stop offset="100%" stop-color="#06642a"/>
    </linearGradient>
    <linearGradient id="azRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f11f26"/>
      <stop offset="100%" stop-color="#c2151b"/>
    </linearGradient>
  </defs>

  <!-- Radiating tick arc -->
  <g stroke="url(#azGreen)" stroke-linecap="round" fill="none">
    <g transform="translate(430 215)">
      <path d="M0-170V-118" stroke-width="7"/>
      <path d="M29.5-167.4 20.5-116.2" stroke-width="7" transform="rotate(10)"/>
      <path d="M0-170V-118" stroke-width="7" transform="rotate(20)"/>
      <path d="M0-170V-118" stroke-width="6.5" transform="rotate(30)"/>
      <path d="M0-170V-118" stroke-width="6.5" transform="rotate(40)"/>
      <path d="M0-170V-118" stroke-width="6" transform="rotate(50)"/>
      <path d="M0-170V-118" stroke-width="6" transform="rotate(60)"/>
      <path d="M0-170V-118" stroke-width="5.5" transform="rotate(70)"/>
      <path d="M0-170V-118" stroke-width="5" transform="rotate(80)"/>
      <path d="M0-170V-118" stroke-width="4.5" transform="rotate(90)"/>
      <path d="M0-170V-118" stroke-width="4" transform="rotate(100)"/>
      <path d="M0-170V-118" stroke-width="3.5" transform="rotate(110)"/>
      <path d="M0-170V-118" stroke-width="3" transform="rotate(120)"/>
      <path d="M0-170V-118" stroke-width="7" transform="rotate(-10)"/>
      <path d="M0-170V-118" stroke-width="7" transform="rotate(-20)"/>
      <path d="M0-170V-118" stroke-width="6.5" transform="rotate(-30)"/>
      <path d="M0-170V-118" stroke-width="6.5" transform="rotate(-40)"/>
      <path d="M0-170V-118" stroke-width="6" transform="rotate(-50)"/>
      <path d="M0-170V-118" stroke-width="6" transform="rotate(-60)"/>
      <path d="M0-170V-118" stroke-width="5.5" transform="rotate(-70)"/>
      <path d="M0-170V-118" stroke-width="5" transform="rotate(-80)"/>
      <path d="M0-170V-118" stroke-width="4.5" transform="rotate(-90)"/>
      <path d="M0-170V-118" stroke-width="4" transform="rotate(-100)"/>
      <path d="M0-170V-118" stroke-width="3.5" transform="rotate(-110)"/>
      <path d="M0-170V-118" stroke-width="3" transform="rotate(-120)"/>
    </g>
  </g>

  <!-- Red 'A' monogram with the black leg -->
  <g stroke-linecap="round" fill="none">
    <path d="M368 332 L448 172" stroke="url(#azRed)" stroke-width="46"/>
    <path d="M455 176 L518 282" stroke="url(#azRed)" stroke-width="46"/>
    <path d="M508 250 L566 322" stroke="#111111" stroke-width="40"/>
    <path d="M512 330 L588 330" stroke="url(#azRed)" stroke-width="42"/>
    <g stroke="url(#azRed)" stroke-width="9">
      <path d="M614 302 L632 264"/>
      <path d="M632 302 L650 264"/>
      <path d="M650 302 L668 264"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="450" y="470" text-anchor="middle" fill="url(#azGreen)"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="132" font-weight="900" letter-spacing="2">AZMAIN</text>
  <text x="450" y="522" text-anchor="middle" fill="url(#azGreen)"
        font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="44" font-weight="900" letter-spacing="3">BD INT.COM</text>
  <text x="450" y="566" text-anchor="middle" fill="#e21a20"
        font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" font-weight="bold">House Of Global Brand</text>
</svg>
